LoadModule fcgid_module "C:/LaX/www/LaX/etc/apache2/modules/mod_fcgid-2.3.9-win64-VC14.so"

<IfModule fcgid_module>
FcgidInitialEnv PATH "C:/LaX/www/LaX/bin/php/php-trash-8.2;C:/Windows/system32;C:/Windows;C:/Windows/System32/Wbem;"
FcgidInitialEnv SystemRoot "C:/Windows"
FcgidInitialEnv SystemDrive "C:"
FcgidInitialEnv TEMP "C:/LaX/www/LaX/tmp"
FcgidInitialEnv TMP "C:/LaX/www/LaX/tmp"
FcgidInitialEnv windir "C:/Windows"
FcgidIOTimeout 36000
FcgidConnectTimeout 16
FcgidMaxRequestsPerProcess 0
FcgidMaxProcesses 50
FcgidMaxRequestLen 81310720
FcgidInitialEnv PHPRC "C:/LaX/www/LaX/bin/php/php-trash-8.2"
FcgidInitialEnv PHP_FCGI_MAX_REQUESTS 0

<Files ~ "\.php$">
AddHandler fcgid-script .php
Options +ExecCGI
FcgidWrapper "C:/LaX/www/LaX/bin/php/php-trash-8.2/php-cgi.exe" .php
</Files>
</IfModule>
